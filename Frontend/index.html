<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Msongola School Result System</title>

    <meta
        name="description"
        content="Msongola Secondary School Result Management System"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .loading-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .loading-card {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            border-radius: 18px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #071a2f;
            color: #c99a2e;
            font-size: 30px;
            font-weight: bold;
        }

        h1 {
            margin: 0 0 8px;
            color: #071a2f;
            font-size: 24px;
        }

        p {
            margin: 0;
            color: #64748b;
            line-height: 1.6;
        }

        .loader {
            width: 35px;
            height: 35px;
            margin: 25px auto 0;
            border: 4px solid #e2e8f0;
            border-top-color: #1d4ed8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <main class="loading-page">

        <section class="loading-card">

            <div class="logo">
                MS
            </div>

            <h1>
                Msongola Secondary School
            </h1>

            <p>
                Mfumo wa Usimamizi wa Matokeo
            </p>

            <div class="loader"></div>

        </section>

    </main>


    <script>
        // ==========================================
        // MSONGOLA RESULT SYSTEM
        // ENTRY POINT
        // ==========================================

        const token =
            localStorage.getItem("msongola_token");

        const storedUser =
            localStorage.getItem("msongola_user");


        // ==========================================
        // REDIRECT BY ROLE
        // ==========================================

        function redirectByRole(role) {

            switch (role) {

                case "ADMIN":

                    window.location.href =
                        "pages/admin/dashboard.html";

                    break;


                case "ACADEMIC_MASTER":

                    window.location.href =
                        "pages/academic-master/dashboard.html";

                    break;


                case "SUBJECT_TEACHER":

                    window.location.href =
                        "teacher/dashboard.html";

                    break;


                default:

                    window.location.href =
                        "pages/login.html";

                    break;

            }

        }


        // ==========================================
        // CHECK EXISTING LOGIN
        // ==========================================

        if (token && storedUser) {

            try {

                const user =
                    JSON.parse(storedUser);

                if (user && user.role) {

                    redirectByRole(user.role);

                } else {

                    window.location.href =
                        "pages/login.html";

                }

            } catch (error) {

                localStorage.removeItem(
                    "msongola_token"
                );

                localStorage.removeItem(
                    "msongola_user"
                );

                window.location.href =
                    "pages/login.html";
            }

        } else {

            // ======================================
            // NO LOGIN
            // GO TO LOGIN PAGE
            // ======================================

            window.location.href =
                "pages/login.html";

        }
    </script>

</body>
</html>
