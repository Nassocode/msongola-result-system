<!doctype html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Ingiza Alama | Msongola Result System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root { --ink:#102a43; --navy:#0b294b; --teal:#168aad; --muted:#627d98; --line:#dfe7ee; --bg:#f3f7f9; }
        * { box-sizing:border-box; }
        body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 "Segoe UI",sans-serif; }
        .shell { max-width:1160px; margin:0 auto; padding:34px 22px; }
        .header { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:22px; }
        .header h1 { margin:0; font-size:29px; color:var(--navy); }
        .header p { margin:5px 0 0; color:var(--muted); }
        .actions { display:flex; gap:9px; }
        button,.button { border:0; border-radius:8px; min-height:40px; padding:0 14px; display:inline-flex; align-items:center; justify-content:center; gap:8px; font:inherit; font-weight:700; text-decoration:none; cursor:pointer; }
        button:disabled { opacity:.55; cursor:not-allowed; }
        .primary { background:var(--teal); color:white; }
        .secondary,.button { background:white; border:1px solid var(--line); color:var(--ink); }
        .panel { background:white; border:1px solid var(--line); border-radius:12px; box-shadow:0 8px 24px rgba(16,42,67,.06); margin-bottom:18px; overflow:hidden; }
        .panel-head { padding:19px 22px; border-bottom:1px solid var(--line); }
        .panel-head h2 { margin:0; font-size:17px; }
        .selectors { display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:18px 22px; }
        label { display:grid; gap:7px; color:var(--muted); font-size:12px; font-weight:700; }
        select,input { width:100%; min-height:42px; border:1px solid #ced9e2; border-radius:8px; background:white; color:var(--ink); font:inherit; padding:8px 11px; }
        select:focus,input:focus { outline:3px solid rgba(22,138,173,.12); border-color:var(--teal); }
        .assignment-info { padding:0 22px 17px; color:var(--muted); }
        .toolbar { display:flex; justify-content:space-between; align-items:center; gap:14px; padding:15px 22px; background:#f8fbfc; border-bottom:1px solid var(--line); }
        .toolbar p { margin:0; color:var(--muted); }
        .table-wrap { overflow:auto; }
        table { width:100%; min-width:650px; border-collapse:collapse; }
        th,td { padding:12px 15px; text-align:left; border-bottom:1px solid #edf1f4; }
        th { background:#f7fafb; color:var(--muted); font-size:11px; text-transform:uppercase; }
        td input { max-width:120px; }
        tbody tr:hover { background:#f7fcfd; }
        .footer-actions { display:flex; justify-content:flex-end; gap:10px; padding:16px 22px; }
        .message { margin:16px 22px; padding:11px 13px; border-radius:8px; background:#eaf8f1; color:#18734f; }
        .message.error { background:#fff0f2; color:#b42335; }
        .message[hidden], [hidden] { display:none !important; }
        .empty { padding:30px 22px; color:var(--muted); text-align:center; }
        @media(max-width:650px) { .shell{padding:22px 13px}.header{align-items:flex-start;flex-direction:column}.selectors{grid-template-columns:1fr}.footer-actions{flex-direction:column-reverse}.footer-actions button{width:100%} }
    </style>
</head>
<body>
<main class="shell">
    <header class="header">
        <div><h1>Ingiza Alama</h1><p>Chagua assignment na mtihani ili kurekodi alama za wanafunzi.</p></div>
        <div class="actions"><a class="button" href="dashboard.html"><i class="fa-solid fa-arrow-left"></i> Dashboard</a><button class="secondary" id="logoutButton" type="button"><i class="fa-solid fa-right-from-bracket"></i> Toka</button></div>
    </header>
    <section class="panel">
        <div class="panel-head"><h2>Assignment na Mtihani</h2></div>
        <div class="selectors">
            <label for="assignmentSelect">Darasa na somo<select id="assignmentSelect"><option value="">Inapakia assignments...</option></select></label>
            <label for="examinationSelect">Mtihani<select id="examinationSelect" disabled><option value="">Chagua assignment kwanza</option></select></label>
        </div>
        <p class="assignment-info" id="assignmentInfo"></p>
    </section>
    <section class="panel">
        <div class="toolbar"><p id="rosterSummary">Chagua assignment ili kuona wanafunzi.</p><span id="submissionStatus"></span></div>
        <div id="pageMessage" class="message" hidden></div>
        <div id="loadingMessage" class="empty" hidden>Inapakia wanafunzi...</div>
        <div class="table-wrap"><table id="marksTable" hidden><thead><tr><th>#</th><th>Admission Number</th><th>Mwanafunzi</th><th>Alama / 100</th><th>Hali</th></tr></thead><tbody id="marksRows"></tbody></table></div>
        <div id="emptyMessage" class="empty">Chagua assignment na mtihani ili kuanza.</div>
        <div class="footer-actions"><button class="secondary" id="saveDraftButton" type="button" disabled><i class="fa-regular fa-floppy-disk"></i> Hifadhi Draft</button><button class="primary" id="submitMarksButton" type="button" disabled><i class="fa-solid fa-paper-plane"></i> Tuma Alama</button></div>
    </section>
</main>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/teacher/marks.js?v=20260928-1"></script>
</body>
</html>
