<!DOCTYPE html>
<html lang="sw">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Teacher Dashboard | Msongola Result System</title>
	<link rel="stylesheet" href="../css/style.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
	<style>
		.teacher-page { min-height: 100vh; background: #f4f7fa; color: #102a43; }
		.teacher-shell { max-width: 1180px; margin: 0 auto; padding: 32px 24px; }
		.teacher-header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
		.teacher-header h1 { margin: 0 0 6px; font-size: 30px; }
		.teacher-header p { margin: 0; color: #627d98; }
		.teacher-actions { display: flex; gap: 10px; }
		.teacher-button { border: 0; border-radius: 8px; padding: 11px 16px; font: inherit; cursor: pointer; }
		.teacher-button.primary { background: #0b294b; color: #fff; }
		.teacher-button.secondary { background: #fff; color: #0b294b; border: 1px solid #d9e2ec; }
		.teacher-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 22px; }
		.teacher-stat, .teacher-panel { background: #fff; border: 1px solid #e3ebf2; border-radius: 12px; box-shadow: 0 6px 20px rgba(11, 41, 75, .06); }
		.teacher-stat { padding: 20px; }
		.teacher-stat span { display: block; color: #627d98; font-size: 13px; }
		.teacher-stat strong { display: block; margin-top: 8px; color: #0b294b; font-size: 28px; }
		.teacher-panel { padding: 22px; }
		.teacher-panel h2 { margin: 0 0 16px; font-size: 20px; }
		.teacher-table { width: 100%; border-collapse: collapse; }
		.teacher-table th, .teacher-table td { padding: 13px 10px; border-bottom: 1px solid #edf2f7; text-align: left; }
		.teacher-table th { color: #627d98; font-size: 12px; text-transform: uppercase; }
		.teacher-empty { color: #627d98; padding: 20px 0; }
		.teacher-error { color: #c83b4a; margin-top: 12px; }
		@media (max-width: 760px) { .teacher-header { align-items: flex-start; flex-direction: column; } .teacher-stats { grid-template-columns: repeat(2, 1fr); } .teacher-panel { overflow-x: auto; } .teacher-table { min-width: 560px; } }
	</style>
</head>
<body class="teacher-page">
	<main class="teacher-shell">
		<header class="teacher-header">
			<div>
				<h1>Teacher Dashboard</h1>
				<p id="teacherWelcome">Karibu kwenye mfumo wa matokeo.</p>
			</div>
			<div class="teacher-actions">
				<a class="teacher-button secondary" href="marks-entry.html"><i class="fa-solid fa-pen-to-square"></i> Ingiza Alama</a>
				<button class="teacher-button secondary" id="refreshTeacherDashboard" type="button"><i class="fa-solid fa-rotate"></i> Refresh</button>
				<button class="teacher-button primary" id="teacherLogout" type="button"><i class="fa-solid fa-right-from-bracket"></i> Toka</button>
			</div>
		</header>

		<section class="teacher-stats" aria-label="Teacher statistics">
			<article class="teacher-stat"><span>Assignments</span><strong id="teacherAssignments">0</strong></article>
			<article class="teacher-stat"><span>Draft submissions</span><strong id="teacherDrafts">0</strong></article>
			<article class="teacher-stat"><span>Submitted</span><strong id="teacherSubmitted">0</strong></article>
			<article class="teacher-stat"><span>Approved</span><strong id="teacherApproved">0</strong></article>
		</section>

		<section class="teacher-panel">
			<h2>My Classes and Subjects</h2>
			<div id="teacherAssignmentsLoading" class="teacher-empty">Inapakia assignments...</div>
			<div id="teacherAssignmentsError" class="teacher-error" hidden></div>
			<table class="teacher-table" id="teacherAssignmentsTable" hidden>
				<thead><tr><th>Class</th><th>Subject</th><th>Academic Year</th><th>Status</th></tr></thead>
				<tbody id="teacherAssignmentsBody"></tbody>
			</table>
			<p id="teacherAssignmentsEmpty" class="teacher-empty" hidden>Hakuna assignment iliyo active.</p>
		</section>
	</main>
	<script src="../js/api.js"></script>
	<script src="../js/auth.js"></script>
	<script src="../js/teacher/dashboard.js?v=20260928-2"></script>
</body>
</html>
