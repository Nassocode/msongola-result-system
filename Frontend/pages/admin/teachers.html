<!doctype html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Walimu | Msongola Result System</title>
<link rel="stylesheet" href="../../css/admin-catalog.css?v=20260928-2">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="catalog-page" data-catalog="teachers">
<main class="catalog-shell">
<header class="catalog-header">
<div><h1><i class="fa-solid fa-chalkboard-user"></i> Walimu</h1><p>Unganisha akaunti ya Subject Teacher na taarifa za mwalimu.</p></div>
<div class="catalog-actions"><button class="catalog-button primary" id="openCatalogModal" type="button"><i class="fa-solid fa-plus"></i> Sajili Mwalimu</button><a class="catalog-button secondary" href="dashboard.html">Dashboard</a></div>
</header>
<section class="catalog-panel">
<div class="catalog-toolbar"><input id="catalogSearch" type="search" placeholder="Tafuta mwalimu, username au namba..."><strong>Teacher Directory</strong></div>
<div id="catalogError" class="catalog-error" hidden></div>
<div class="catalog-table-wrap"><table class="catalog-table" id="catalogTable"><thead><tr><th>#</th><th>Mwalimu</th><th>Username</th><th>Simu</th><th>Status</th></tr></thead><tbody id="catalogList"></tbody></table><div id="catalogEmpty" class="catalog-empty" hidden>Hakuna walimu waliopatikana.</div></div>
</section>
</main>
<div class="catalog-modal" id="catalogModal" hidden><form class="catalog-form" id="catalogForm"><h2>Sajili Mwalimu</h2><div id="catalogAlert" class="catalog-alert" hidden></div>
<div class="catalog-field"><label for="teacherUserId">Subject Teacher Account</label><select id="teacherUserId" name="user_id" required><option value="">Inapakia accounts...</option></select></div>
<div class="catalog-field"><label for="teacherNumber">Teacher Number</label><input id="teacherNumber" name="teacher_number" required placeholder="Mfano: TCH001"></div>
<div class="catalog-field"><label for="firstName">Jina la Kwanza</label><input id="firstName" name="first_name" required></div>
<div class="catalog-field"><label for="middleName">Jina la Kati</label><input id="middleName" name="middle_name"></div>
<div class="catalog-field"><label for="lastName">Jina la Mwisho</label><input id="lastName" name="last_name" required></div>
<div class="catalog-field"><label for="gender">Jinsia</label><select id="gender" name="gender"><option value="">Chagua jinsia</option><option value="MALE">Mwanaume</option><option value="FEMALE">Mwanamke</option></select></div>
<div class="catalog-field"><label for="phone">Simu</label><input id="phone" name="phone"></div>
<div class="catalog-field"><label for="email">Email</label><input id="email" name="email" type="email"></div>
<div class="catalog-form-actions"><button class="catalog-button secondary" id="cancelCatalogModal" type="button">Ghairi</button><button class="catalog-button primary" type="submit">Hifadhi Mwalimu</button></div>
</form></div>
<script src="../../js/api.js"></script><script src="../../js/auth.js"></script><script src="../../js/admin/catalog.js?v=20260928-2"></script>
</body></html>
