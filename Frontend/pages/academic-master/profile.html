<!doctype html>
<html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wasifu | Academic Master</title><link rel="stylesheet" href="../../css/academic-operations.css?v=2"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>
.profile-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr);gap:18px}.profile-card{padding:22px}.profile-card h2{margin:0 0 16px;color:#102a43;font-size:17px}.profile-details{display:grid;grid-template-columns:1fr 1fr;gap:14px}.profile-item{padding:12px;border:1px solid #e6eaf0;border-radius:8px;background:#fbfcfd}.profile-item span{display:block;color:#829ab1;font-size:10px;text-transform:uppercase}.profile-item strong{display:block;margin-top:4px;color:#102a43;font-size:13px;overflow-wrap:anywhere}.profile-form{display:grid;gap:12px}.profile-form label{display:grid;gap:6px;color:#627d98;font-size:12px;font-weight:700}.profile-form input{min-height:42px;padding:9px 11px;border:1px solid #d2dde6;border-radius:8px;font:inherit}.profile-form button{justify-self:start}.profile-message{margin:0;padding:10px 12px;border-radius:8px;background:#eaf8f1;color:#18734f}.profile-message.error{background:#fff0f2;color:#a71930}.profile-message[hidden]{display:none}@media(max-width:760px){.profile-grid{grid-template-columns:1fr}.profile-details{grid-template-columns:1fr}}

<body class="academic-ops"><main class="ops-shell"><header class="ops-header"><div><h1><i class="fa-solid fa-user"></i> Wasifu Wangu</h1><p>Taarifa za akaunti yako ya Academic Master.</p></div></header><section class="profile-grid"><article class="ops-panel profile-card"><h2>Taarifa za Akaunti</h2><div class="profile-details"><div class="profile-item"><span>Jina / Username</span><strong id="profileUsername">Inapakia...</strong></div><div class="profile-item"><span>Role</span><strong id="profileRole">Academic Master</strong></div><div class="profile-item"><span>Hali ya akaunti</span><strong id="profileStatus">-</strong></div><div class="profile-item"><span>Akaunti tangu</span><strong id="profileCreated">-</strong></div><div class="profile-item"><span>Shule</span><strong id="profileSchool">-</strong></div><div class="profile-item"><span>Head of School</span><strong id="profileHead">-</strong></div></div></article><article class="ops-panel profile-card"><h2>Badili Password</h2><form class="profile-form" id="passwordForm"><div class="profile-message" id="profileMessage" hidden></div><label>Password ya sasa<input name="current_password" type="password" autocomplete="current-password" required></label><label>Password mpya<input name="new_password" type="password" minlength="8" autocomplete="new-password" required></label><label>Thibitisha password mpya<input name="confirm_password" type="password" minlength="8" autocomplete="new-password" required></label><button class="ops-button" type="submit"><i class="fa-solid fa-key"></i> Hifadhi Password</button></form></article></section></main><script src="../../js/api.js"></script><script src="../../js/auth.js"></script><script src="../../js/academic-master/profile.js?v=1"></script><footer class="designer-credit" aria-label="Designer contact">
