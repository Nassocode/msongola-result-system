<!doctype html>
<html lang="sw">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Mark Submissions | Academic Master</title>
	<link rel="stylesheet" href="../../css/academic-operations.css?v=2">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="academic-ops" data-operation="submissions">
	<main class="ops-shell">
		<header class="ops-header">
			<div>
				<h1><i class="fa-solid fa-file-circle-check"></i> Mark Submissions</h1>
				<p>Chagua darasa kuona walimu, wanafunzi na alama zilizotumwa.</p>
			</div>
			<div class="ops-actions"><a class="ops-button secondary" href="dashboard.html">Dashboard</a></div>
		</header>
		<section class="ops-panel">
			<div class="ops-toolbar">
				<input id="opsSearch" type="search" placeholder="Tafuta darasa, mwanafunzi, mwalimu, somo...">
				<span class="ops-count" id="opsCount"></span>
			</div>
			<div class="ops-error" id="opsError" hidden></div>
			<div class="ops-class-list" id="opsSubmissionClasses" hidden></div>
			<div class="ops-table-wrap" id="opsTableWrap" hidden>
				<table class="ops-table" id="opsTable"><tbody id="opsRows"></tbody></table>
			</div>
			<div class="ops-empty" id="opsEmpty" hidden></div>
		</section>
	</main>
	<script src="../../js/api.js"></script>
	<script src="../../js/auth.js"></script>
	<script src="../../js/academic-master/operations.js?v=2"></script>
</body>
</html>
