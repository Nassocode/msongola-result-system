<!doctype html>
<html lang="sw">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Mark Submissions | Academic Master</title>
	<link rel="stylesheet" href="../../css/academic-operations.css?v=2">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../../css/designer-credit.css">
</head>
<body class="academic-ops submissions-page" data-operation="submissions">
	<main class="ops-shell">
		<header class="ops-header">
			<div>
				<h1><i class="fa-solid fa-file-circle-check"></i> Mark Submissions</h1>
				<p>Kagua alama za kila somo, linganisha matokeo ya wanafunzi, kisha idhinisha au rudisha kazi kwa marekebisho.</p>
			</div>
			<div class="ops-actions"><a class="ops-button secondary" href="dashboard.html">Dashboard</a></div>
		</header>
		<section class="ops-panel">
			<div class="ops-toolbar">
				<label class="ops-search-field">
					<i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
					<input id="opsSearch" type="search" placeholder="Tafuta darasa, mwanafunzi, mwalimu au somo..." aria-label="Tafuta submissions">
				</label>
				<select id="opsStatusFilter" aria-label="Chuja kwa hali">
					<option value="">Hali zote</option>
					<option value="SUBMITTED">Zinazosubiri</option>
					<option value="APPROVED">Zilizoidhinishwa</option>
					<option value="RETURNED">Zilizorudishwa</option>
				</select>
				<span class="ops-count" id="opsCount"></span>
			</div>
			<div class="ops-error" id="opsError" hidden></div>
			<div class="ops-class-list" id="opsSubmissionClasses" hidden></div>
			<div class="ops-table-wrap" id="opsTableWrap" hidden>
				<table class="ops-table" id="opsTable"><tbody id="opsRows"></tbody></table>
			</div>
			<div class="ops-empty" id="opsEmpty" hidden></div>
		</section>
	</main>
	<script src="../../js/api.js"></script>
	<script src="../../js/auth.js"></script>
	<script src="../../js/academic-master/operations.js?v=2"></script>
<footer class="designer-credit" aria-label="Designer contact">

</footer>
</body>
</html>
