<!doctype html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mitihani | Academic Master</title><link rel="stylesheet" href="../../css/academic-operations.css?v=1"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="../../css/designer-credit.css">
</head><body class="academic-ops" data-operation="examinations"><main class="ops-shell"><header class="ops-header"><div><h1><i class="fa-solid fa-file-pen"></i> Mitihani</h1><p>Tengeneza na simamia mitihani kwa mwaka wa masomo.</p></div><div class="ops-actions"><button class="ops-button" id="openOpsModal" type="button"><i class="fa-solid fa-plus"></i> Tengeneza Mtihani</button><a class="ops-button secondary" href="dashboard.html">Dashboard</a></div></header><section class="ops-panel"><div class="ops-toolbar"><input id="opsSearch" type="search" placeholder="Tafuta mtihani, term au mwaka..."><span class="ops-count" id="opsCount"></span></div><div class="ops-error" id="opsError" hidden></div><div class="ops-table-wrap"><table class="ops-table" id="opsTable"><thead><tr><th>#</th><th>Mtihani</th><th>Aina</th><th>Term</th><th>Mwaka</th><th>Kuanzia</th><th>Mpaka</th><th>Status</th></tr></thead><tbody id="opsRows"></tbody></table><div class="ops-empty" id="opsEmpty" hidden></div></div></section></main><div class="ops-modal" id="opsModal" hidden><form class="ops-form" id="opsForm"><h2>Tengeneza Mtihani</h2><div id="opsFormError" class="ops-error" hidden></div><div class="ops-fields"><label class="ops-field full">Jina la mtihani<input name="exam_name" required maxlength="150" placeholder="Mfano: Mid Term Examination"></label><label class="ops-field">Academic Year<select id="examYear" name="academic_year_id" required></select></label><label class="ops-field">Aina<select name="exam_type"><option value="MID_TERM">Mid Term</option><option value="TERMINAL">Terminal</option><option value="ANNUAL">Annual</option><option value="OTHER">Other</option></select></label><label class="ops-field">Term<input name="term" placeholder="Mfano: Term 1"></label><label class="ops-field">Status<select name="status"><option value="DRAFT">Draft</option><option value="OPEN">Open</option><option value="CLOSED">Closed</option></select></label><label class="ops-field">Tarehe ya kuanza<input type="date" name="start_date"></label><label class="ops-field">Tarehe ya mwisho<input type="date" name="end_date"></label></div><div class="ops-form-actions"><button class="ops-button secondary" id="cancelOpsModal" type="button">Ghairi</button><button class="ops-button" type="submit">Hifadhi Mtihani</button></div></form></div><script src="../../js/api.js"></script><script src="../../js/auth.js"></script><script src="../../js/academic-master/operations.js?v=1"></script><footer class="designer-credit" aria-label="Designer contact">
